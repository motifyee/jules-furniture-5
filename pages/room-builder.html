<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Builder - Damietta Heritage</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../layout.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../brand-personalities/artisan-heritage.css">
  <style>
    .quiz-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); margin-top: var(--space-6); }
    @media (min-width: 768px) { .quiz-options { grid-template-columns: repeat(4, 1fr); } }
    .quiz-option { border: 2px solid var(--color-border); padding: var(--space-4); border-radius: var(--radius-md); cursor: pointer; transition: border-color 0.2s; }
    .quiz-option:hover { border-color: var(--color-accent); }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav__logo">
      <a href="index.html">Damietta Crafts</a>
    </div>
    <div class="top-nav__links">
      <a href="gallery.html">Shop</a>
      <a href="collections.html">Collections</a>
      <a href="custom-order.html">Custom Orders</a>
      <a href="about.html">About</a>
      <a href="showroom.html">Showroom</a>
    </div>
    <div class="top-nav__actions">
      <button class="top-nav__action" aria-label="Search">🔍</button>
      <a href="#" class="top-nav__action" aria-label="Wishlist">♥</a>
      <a href="#" class="top-nav__action" aria-label="Cart">🛒</a>
    </div>
  </nav>

  <div class="container section u-text-center u-max-w-lg">
    <div class="form-card">
      <h2>What room are you furnishing?</h2>
      <p>Tell us about your space. We'll find the right pieces.</p>
      <div class="quiz-options">
        <div class="quiz-option">Living Room</div>
        <div class="quiz-option">Bedroom</div>
        <div class="quiz-option">Dining Room</div>
        <div class="quiz-option">Office</div>
      </div>
      <div class="u-mt-8">
        <button class="btn btn--outline" disabled>Back</button>
        <button class="btn">Next</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer__grid">
        <div>
          <div class="footer__title">Damietta Crafts</div>
          <p class="u-text-secondary u-mb-6" style="max-width: 300px;">Handmade in Damietta, Egypt.</p>
        </div>
      </div>
    </div>
  </footer>

  <nav class="mobile-tab-bar">
    <a href="index.html" class="mobile-tab-bar__item">
      <span class="mobile-tab-bar__icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="gallery.html" class="mobile-tab-bar__item">
      <span class="mobile-tab-bar__icon">🛋️</span>
      <span>Shop</span>
    </a>
  </nav>
  <script src="../main.js"></script>
</body>
</html>
