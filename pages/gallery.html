<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Damietta Heritage</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../layout.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../brand-personalities/artisan-heritage.css">
  <style>
    .gallery-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    @media (min-width: 1024px) {
      .gallery-layout {
        grid-template-columns: 240px 1fr;
      }
    }
    .filter-panel {
      position: sticky;
      top: var(--space-8);
    }
    .filter-group {
      margin-block-end: var(--space-6);
    }
    .filter-group__title {
      font-size: var(--text-base);
      font-family: var(--font-label);
      font-weight: bold;
      text-transform: uppercase;
      margin-block-end: var(--space-3);
    }
    .filter-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-block-end: var(--space-2);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav style="padding: var(--space-6); background: var(--color-surface); display:flex; justify-content:space-between; border-bottom: 1px solid var(--color-border)">
    <div class="nav__logo"><a href="index.html">Damietta Crafts</a></div>
  </nav>

  <div class="container section">
    <h1 style="margin-bottom: var(--space-8)">Furniture Gallery</h1>

    <div class="gallery-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-panel" role="search" aria-label="Filters">
        <div class="filter-group">
          <div class="filter-group__title">Room</div>
          <label class="filter-label"><input type="checkbox"> Living Room</label>
          <label class="filter-label"><input type="checkbox"> Bedroom</label>
          <label class="filter-label"><input type="checkbox"> Dining Room</label>
          <label class="filter-label"><input type="checkbox"> Office</label>
        </div>
        <div class="filter-group">
          <div class="filter-group__title">Material</div>
          <label class="filter-label"><input type="checkbox"> Solid Walnut</label>
          <label class="filter-label"><input type="checkbox"> Oak</label>
          <label class="filter-label"><input type="checkbox"> Linen</label>
        </div>
        <button class="btn btn--outline" style="width:100%">Apply Filters</button>
      </aside>

      <!-- Product Grid -->
      <main>
        <div style="margin-block-end: var(--space-4); display: flex; justify-content: space-between;">
          <span>Showing 24 of 87 pieces</span>
          <select aria-label="Sort products" style="border: 1px solid var(--color-border); padding: var(--space-2);">
            <option>Featured</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
          </select>
        </div>

        <div class="grid grid--3-col">
          <!-- Card 1 -->
          <article class="product-card">
            <span class="product-card__badge" style="border-top: 3px solid var(--material-walnut)">Solid Walnut</span>
            <button class="product-card__wishlist" aria-label="Add to wishlist">♥</button>
            <a href="product.html" class="product-card__image-wrap" aria-label="View Malak Walnut Dining Table">
              <img src="https://images.unsplash.com/photo-1577140917170-285929fb55b7?auto=format&fit=crop&w=400" alt="Malak Walnut Dining Table isolated" class="product-card__image product-card__image--main" loading="lazy">
              <img src="https://images.unsplash.com/photo-1604578762246-41134e37f9cc?auto=format&fit=crop&w=400" alt="Malak Walnut Dining Table in room scene" class="product-card__image product-card__image--alt" loading="lazy">
            </a>
            <div class="product-card__info">
              <h2 class="product-card__title">Malak Dining Table</h2>
              <p class="product-card__material">Solid Walnut, Matte Oil</p>
              <p class="product-card__price">EGP 24,000</p>
              <button class="btn product-card__quick-add">Quick View</button>
            </div>
          </article>

          <!-- Card 2 -->
          <article class="product-card">
            <span class="product-card__badge" style="border-top: 3px solid var(--fabric-linen)">Linen</span>
            <button class="product-card__wishlist" aria-label="Add to wishlist">♥</button>
            <a href="product.html" class="product-card__image-wrap" aria-label="View Fayrouz Sofa">
              <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=400" alt="Fayrouz Sofa isolated" class="product-card__image product-card__image--main" loading="lazy">
              <img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&w=400" alt="Fayrouz Sofa in room scene" class="product-card__image product-card__image--alt" loading="lazy">
            </a>
            <div class="product-card__info">
              <h2 class="product-card__title">Fayrouz Sofa</h2>
              <p class="product-card__material">Natural Linen, Oak Frame</p>
              <p class="product-card__price">EGP 32,500</p>
              <button class="btn product-card__quick-add">Quick View</button>
            </div>
          </article>

          <!-- Card 3 -->
          <article class="product-card">
            <span class="product-card__badge" style="border-top: 3px solid var(--material-oak)">Solid Oak</span>
            <button class="product-card__wishlist" aria-label="Add to wishlist">♥</button>
            <a href="product.html" class="product-card__image-wrap" aria-label="View Cairo Bookshelf">
              <img src="https://images.unsplash.com/photo-1594620302200-9a762244a156?auto=format&fit=crop&w=400" alt="Cairo Bookshelf isolated" class="product-card__image product-card__image--main" loading="lazy">
              <img src="https://images.unsplash.com/photo-1507149833265-60c372daea22?auto=format&fit=crop&w=400" alt="Cairo Bookshelf in room scene" class="product-card__image product-card__image--alt" loading="lazy">
            </a>
            <div class="product-card__info">
              <h2 class="product-card__title">Cairo Bookshelf</h2>
              <p class="product-card__material">Solid Oak</p>
              <p class="product-card__price">EGP 18,000</p>
              <button class="btn product-card__quick-add">Quick View</button>
            </div>
          </article>
        </div>
        <div style="margin-block-start: var(--space-8); text-align: center;">
          <button class="btn btn--outline">Load More</button>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
