<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Orders - Damietta Heritage</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../layout.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../brand-personalities/artisan-heritage.css">
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav__logo">
      <a href="index.html">Damietta Crafts</a>
    </div>
    <div class="top-nav__links">
      <a href="gallery.html">Shop</a>
      <a href="collections.html">Collections</a>
      <a href="custom-order.html">Custom Orders</a>
      <a href="about.html">About</a>
      <a href="showroom.html">Showroom</a>
    </div>
    <div class="top-nav__actions">
      <button class="top-nav__action" aria-label="Search">🔍</button>
      <a href="#" class="top-nav__action" aria-label="Wishlist">♥</a>
      <a href="#" class="top-nav__action" aria-label="Cart">🛒</a>
    </div>
  </nav>

  <div class="container section">
    <h1 class="u-text-center u-mb-2">Custom Orders</h1>
    <p class="u-text-center u-mb-8">Have a vision? We'll build it exactly.</p>

    <form class="form-card u-max-w-md">
      <div class="form-group">
        <label class="form-label" for="productType">Product Type</label>
        <select id="productType" class="form-input">
          <option>Dining Table</option>
          <option>Sofa</option>
          <option>Wardrobe</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="dimensions">Room Dimensions (cm)</label>
        <input type="text" id="dimensions" class="form-input" placeholder="e.g. 200 x 100 x 75">
      </div>
      <div class="form-group">
        <label class="form-label" for="details">Special Requirements</label>
        <textarea id="details" class="form-input" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="contact">Preferred Contact (WhatsApp Number)</label>
        <input type="tel" id="contact" class="form-input">
      </div>
      <button type="button" class="btn u-w-full">Submit Request</button>
    </form>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer__grid">
        <div>
          <div class="footer__title">Damietta Crafts</div>
          <p class="u-text-secondary u-mb-6" style="max-width: 300px;">Handmade in Damietta, Egypt.</p>
        </div>
      </div>
    </div>
  </footer>

  <nav class="mobile-tab-bar">
    <a href="index.html" class="mobile-tab-bar__item">
      <span class="mobile-tab-bar__icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="gallery.html" class="mobile-tab-bar__item">
      <span class="mobile-tab-bar__icon">🛋️</span>
      <span>Shop</span>
    </a>
  </nav>
  <script src="../main.js"></script>
</body>
</html>
