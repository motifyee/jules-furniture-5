<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Orders - Damietta Heritage</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../layout.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../brand-personalities/artisan-heritage.css">
  <style>
    .custom-form { max-width: 600px; margin-inline: auto; background: var(--color-surface); padding: var(--space-8); border-radius: var(--radius-lg); }
    .form-group { margin-block-end: var(--space-4); }
    .form-label { display: block; font-family: var(--font-label); font-size: var(--text-sm); margin-block-end: var(--space-2); }
    .form-input { width: 100%; border: 1px solid var(--color-border); padding: var(--space-3); border-radius: var(--radius-sm); font-family: var(--font-body); }
  </style>
</head>
<body>
  <nav style="padding: var(--space-6); background: var(--color-surface); border-bottom: 1px solid var(--color-border)">
    <div class="nav__logo"><a href="index.html">Damietta Crafts</a></div>
  </nav>
  <div class="container section">
    <h1 style="text-align: center; margin-bottom: var(--space-2)">Custom Orders</h1>
    <p style="text-align: center; margin-bottom: var(--space-8)">Have a vision? We'll build it exactly.</p>

    <form class="custom-form">
      <div class="form-group">
        <label class="form-label" for="productType">Product Type</label>
        <select id="productType" class="form-input">
          <option>Dining Table</option>
          <option>Sofa</option>
          <option>Wardrobe</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="dimensions">Room Dimensions (cm)</label>
        <input type="text" id="dimensions" class="form-input" placeholder="e.g. 200 x 100 x 75">
      </div>
      <div class="form-group">
        <label class="form-label" for="details">Special Requirements</label>
        <textarea id="details" class="form-input" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="contact">Preferred Contact (WhatsApp Number)</label>
        <input type="tel" id="contact" class="form-input">
      </div>
      <button type="button" class="btn" style="width: 100%">Submit Request</button>
    </form>
  </div>
</body>
</html>
