<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Damietta Heritage</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../layout.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../brand-personalities/artisan-heritage.css">
</head>
<body>
  <nav style="padding: var(--space-6); background: var(--color-surface); border-bottom: 1px solid var(--color-border)">
    <div class="nav__logo"><a href="index.html">Damietta Crafts</a></div>
  </nav>
  <div class="container section" style="max-width: 600px; margin-inline: auto;">
    <h1 style="text-align: center; margin-bottom: var(--space-8)">Contact Us</h1>
    <form style="background: var(--color-surface); padding: var(--space-8); border-radius: var(--radius-lg);">
      <div style="margin-bottom: var(--space-4)">
        <label style="display: block; margin-bottom: var(--space-2)">Name</label>
        <input type="text" style="width: 100%; border: 1px solid var(--color-border); padding: var(--space-3); border-radius: var(--radius-sm);">
      </div>
      <div style="margin-bottom: var(--space-4)">
        <label style="display: block; margin-bottom: var(--space-2)">Email</label>
        <input type="email" style="width: 100%; border: 1px solid var(--color-border); padding: var(--space-3); border-radius: var(--radius-sm);">
      </div>
      <div style="margin-bottom: var(--space-4)">
        <label style="display: block; margin-bottom: var(--space-2)">Message</label>
        <textarea rows="5" style="width: 100%; border: 1px solid var(--color-border); padding: var(--space-3); border-radius: var(--radius-sm);"></textarea>
      </div>
      <button class="btn" style="width: 100%">Send Message</button>
    </form>
  </div>
</body>
</html>
