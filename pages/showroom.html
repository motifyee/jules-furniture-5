<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showroom - Damietta Heritage</title>
  <link rel="stylesheet" href="../base.css">

      <div style="background: var(--color-border); aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md);">
